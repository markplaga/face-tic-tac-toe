<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Tic-Tac-Toe</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: #ffffff;
      --ink: #252525;
      --accent: #7b5cff;
      --accent2: #ff7a59;
      --line: #292929;
      --muted: #6c6c6c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(123,92,255,.15), transparent 30%),
        radial-gradient(circle at bottom right, rgba(255,122,89,.16), transparent 28%),
        var(--bg);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .app {
      width: min(960px, 100%);
      display: grid;
      grid-template-columns: minmax(280px, 360px) minmax(300px, 1fr);
      gap: 28px;
      align-items: start;
    }
    .panel {
      background: rgba(255,255,255,.93);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.10);
      border: 1px solid rgba(0,0,0,.06);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: .95;
      letter-spacing: -0.05em;
    }
    .subtitle { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
    .players { display: grid; gap: 16px; }
    .player-card {
      border: 2px solid #ececec;
      border-radius: 18px;
      padding: 14px;
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 14px;
      align-items: center;
      transition: .2s ease;
    }
    .player-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(123,92,255,.10);
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #fff;
      box-shadow: 0 0 0 2px #ddd;
      object-fit: cover;
      background: #eee;
      display: block;
    }
    .avatar.placeholder {
      display: grid;
      place-items: center;
      font-size: 28px;
      font-weight: 800;
      color: #777;
    }
    .player-card:nth-child(2) .avatar.placeholder { color: var(--accent2); }
    label.upload {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 8px;
      padding: 9px 12px;
      border-radius: 12px;
      background: #f1efff;
      color: #4c35c9;
      font-weight: 700;
      cursor: pointer;
      font-size: .9rem;
    }
    label.upload.player2 { background: #fff0eb; color: #c94f2f; }
    input[type=file] { display: none; }
    input[type=text] {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 9px 10px;
      font: inherit;
      font-weight: 700;
    }
    .controls { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 13px;
      padding: 11px 16px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform .15s ease, opacity .15s ease;
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .primary { background: var(--accent); color: white; }
    .secondary { background: #ededed; color: #333; }
    .game-panel { text-align: center; }
    .status {
      min-height: 30px;
      font-weight: 900;
      font-size: 1.15rem;
      margin-bottom: 18px;
    }
    .board {
      width: min(520px, 100%);
      aspect-ratio: 1;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: var(--line);
      border-radius: 24px;
      padding: 10px;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.15);
    }
    .cell {
      padding: 0;
      border-radius: 15px;
      background: white;
      overflow: hidden;
      display: grid;
      place-items: center;
      min-width: 0;
      position: relative;
    }
    .cell:hover:not(:disabled) { background: #fafafa; }
    .cell:disabled { cursor: default; }
    .cell img {
      width: 84%;
      height: 84%;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid white;
      box-shadow: 0 0 0 4px var(--accent);
      animation: pop .18s ease-out;
    }
    .cell.player2 img { box-shadow: 0 0 0 4px var(--accent2); }
    .cell .fallback {
      width: 76%;
      height: 76%;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #efeaff;
      color: var(--accent);
      font-size: clamp(2rem, 9vw, 5.6rem);
      font-weight: 1000;
      animation: pop .18s ease-out;
    }
    .cell.player2 .fallback { background: #fff0eb; color: var(--accent2); }
    .cell.win { background: #fff7bf; animation: pulse .8s ease-in-out infinite alternate; }
    .help { margin-top: 16px; color: var(--muted); font-size: .9rem; }
    @keyframes pop { from { transform: scale(.45); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes pulse { to { filter: brightness(1.06); } }
    @media (max-width: 760px) {
      .app { grid-template-columns: 1fr; }
      .panel { padding: 18px; border-radius: 20px; }
      .game-panel { order: -1; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel setup-panel">
      <h1>Face<br>Tic-Tac-Toe</h1>
      <p class="subtitle">Upload two face photos. The players’ pictures become the game pieces.</p>
      <div class="players">
        <div class="player-card active" id="card1">
          <div id="previewWrap1" class="avatar placeholder" aria-label="Player 1 preview">1</div>
          <div>
            <input id="name1" type="text" value="Player 1" maxlength="20" aria-label="Player 1 name">
            <label class="upload" for="photo1">📷 Upload face</label>
            <input id="photo1" type="file" accept="image/*">
          </div>
        </div>
        <div class="player-card" id="card2">
          <div id="previewWrap2" class="avatar placeholder" aria-label="Player 2 preview">2</div>
          <div>
            <input id="name2" type="text" value="Player 2" maxlength="20" aria-label="Player 2 name">
            <label class="upload player2" for="photo2">📷 Upload face</label>
            <input id="photo2" type="file" accept="image/*">
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="primary" id="newGame">New Game</button>
        <button class="secondary" id="clearPhotos">Clear Photos</button>
      </div>
    </section>
    <section class="panel game-panel">
      <div id="status" class="status">Player 1's turn</div>
      <div class="board" id="board" aria-label="Tic tac toe board"></div>
      <div class="help">Tap any open square. Three faces in a row wins.</div>
    </section>
  </main>
  <script>
    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const cards = [document.getElementById("card1"), document.getElementById("card2")];
    const nameInputs = [document.getElementById("name1"), document.getElementById("name2")];
    const photoInputs = [document.getElementById("photo1"), document.getElementById("photo2")];
    const previews = [document.getElementById("previewWrap1"), document.getElementById("previewWrap2")];
    let board = Array(9).fill(null);
    let currentPlayer = 0;
    let gameOver = false;
    let photos = [null, null];
    const winningLines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function playerName(index) {
      return nameInputs[index].value.trim() || `Player ${index + 1}`;
    }
    function makePiece(player) {
      if (photos[player]) {
        const img = document.createElement("img");
        img.src = photos[player];
        img.alt = `${playerName(player)} face`;
        return img;
      }
      const fallback = document.createElement("div");
      fallback.className = "fallback";
      fallback.textContent = player + 1;
      return fallback;
    }
    function renderBoard() {
      boardEl.innerHTML = "";
      board.forEach((value, index) => {
        const cell = document.createElement("button");
        cell.className = "cell";
        cell.setAttribute("aria-label", `Square ${index + 1}`);
        if (value !== null) {
          cell.classList.add(value === 1 ? "player2" : "player1");
          cell.appendChild(makePiece(value));
          cell.disabled = true;
        } else {
          cell.disabled = gameOver;
          cell.addEventListener("click", () => play(index));
        }
        boardEl.appendChild(cell);
      });
    }
    function play(index) {
      if (gameOver || board[index] !== null) return;
      board[index] = currentPlayer;
      const winner = findWinner();
      if (winner) {
        gameOver = true;
        statusEl.textContent = `${playerName(currentPlayer)} wins!`;
        renderBoard();
        winner.forEach(i => boardEl.children[i].classList.add("win"));
        cards.forEach(card => card.classList.remove("active"));
        return;
      }
      if (board.every(cell => cell !== null)) {
        gameOver = true;
        statusEl.textContent = "It's a draw!";
        cards.forEach(card => card.classList.remove("active"));
        renderBoard();
        return;
      }
      currentPlayer = currentPlayer === 0 ? 1 : 0;
      updateTurn();
      renderBoard();
    }
    function findWinner() {
      return winningLines.find(([a,b,c]) => board[a] !== null && board[a] === board[b] && board[a] === board[c]);
    }
    function updateTurn() {
      statusEl.textContent = `${playerName(currentPlayer)}'s turn`;
      cards.forEach((card, i) => card.classList.toggle("active", i === currentPlayer));
    }
    function newGame() {
      board = Array(9).fill(null);
      currentPlayer = 0;
      gameOver = false;
      updateTurn();
      renderBoard();
    }
    function handlePhoto(player, file) {
      if (!file) return;
      if (!file.type.startsWith("image/")) {
        alert("Please choose an image file.");
        return;
      }
      const reader = new FileReader();
      reader.onload = event => {
        photos[player] = event.target.result;
        const img = document.createElement("img");
        img.src = photos[player];
        img.alt = `${playerName(player)} preview`;
        img.className = "avatar";
        previews[player].replaceWith(img);
        previews[player] = img;
        renderBoard();
      };
      reader.readAsDataURL(file);
    }
    photoInputs.forEach((input, player) => {
      input.addEventListener("change", () => handlePhoto(player, input.files[0]));
    });
    nameInputs.forEach(input => {
      input.addEventListener("input", () => {
        if (!gameOver) updateTurn();
        renderBoard();
      });
    });
    document.getElementById("newGame").addEventListener("click", newGame);
    document.getElementById("clearPhotos").addEventListener("click", () => {
      photos = [null, null];
      photoInputs.forEach(input => input.value = "");
      previews.forEach((preview, player) => {
        const placeholder = document.createElement("div");
        placeholder.id = `previewWrap${player + 1}`;
        placeholder.className = "avatar placeholder";
        placeholder.setAttribute("aria-label", `Player ${player + 1} preview`);
        placeholder.textContent = player + 1;
        preview.replaceWith(placeholder);
        previews[player] = placeholder;
      });
      newGame();
    });
    renderBoard();
  </script>
</body>
</html>
